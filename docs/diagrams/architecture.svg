<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1000" height="800" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Glass Box middleware — trust boundary</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#6b7280">Volc Agent Launchpad · integration seam: AgentRunner inside AgentService.executeRun</text>

  <!-- Web UI -->
  <rect x="40" y="76" width="920" height="46" rx="6" fill="#eef4fb" stroke="#2c5282" stroke-width="1.5"/>
  <text x="60" y="105" font-size="13.5" font-weight="600" fill="#1e3a5f">React Web UI</text>
  <text x="180" y="105" font-size="12.5" fill="#334155">Playground · TracePanel timeline · GET /api/agents/:id/memory</text>
  <line x1="330" y1="122" x2="330" y2="152" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="142" font-size="11.5" fill="#6b7280">HTTP</text>

  <!-- Control plane -->
  <rect x="40" y="152" width="580" height="264" rx="6" fill="#eef4fb" stroke="#2c5282" stroke-width="1.8"/>
  <text x="60" y="176" font-size="13.5" font-weight="700" fill="#1e3a5f">FASTIFY CONTROL PLANE</text>
  <text x="232" y="176" font-size="11.5" font-style="italic" fill="#2c5282">trusted</text>

  <rect x="60" y="188" width="540" height="106" rx="5" fill="#ffffff" stroke="#93b4d6" stroke-width="1.2"/>
  <text x="76" y="208" font-size="12.5" font-weight="600" fill="#1f2937">AgentService.executeRun</text>
  <text x="76" y="232" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#374151">├─ memory.prepareTurn()   → { prompt, threadId, turnNumber }</text>
  <text x="76" y="252" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#374151">├─ runner.run({ prompt, threadId, onEventLine })</text>
  <text x="76" y="272" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#374151">└─ memory.recordTurn()    on success AND failure</text>

  <g font-size="11.5" font-weight="600" fill="#1e3a5f" text-anchor="middle">
    <rect x="60"  y="308" width="100" height="36" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="110" y="331">Interceptor</text>
    <rect x="170" y="308" width="100" height="36" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="220" y="331">Compactor</text>
    <rect x="280" y="308" width="100" height="36" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="330" y="331">StepTrace</text>
    <rect x="390" y="308" width="100" height="36" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="440" y="331">Redactor</text>
    <rect x="500" y="308" width="100" height="36" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="550" y="331">Store</text>
  </g>
  <text x="60" y="366" font-size="11.5" fill="#475569">Optional constructor argument. A middleware failure degrades to an unmodified turn;</text>
  <text x="60" y="384" font-size="11.5" fill="#475569">it can never be the reason a Run does not execute. MEMORY_ENABLED=false bypasses all of it.</text>
  <text x="60" y="404" font-size="11.5" font-weight="600" fill="#166534">Context measured from the provider's own usage.input_tokens — never estimated.</text>

  <!-- Host state -->
  <rect x="650" y="152" width="310" height="264" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1.8"/>
  <text x="668" y="176" font-size="12.5" font-weight="700" fill="#14532d">HOST STATE — never mounted</text>
  <text x="668" y="196" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#166534">&lt;APP_DATA_DIR&gt;/memory/&lt;agentId&gt;/</text>
  <g font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#374151">
    <text x="676" y="222">state.json</text><text x="676" y="242">checkpoint.json</text>
    <text x="676" y="262">checkpoint_vN.json</text><text x="676" y="282">residue.json</text>
    <text x="676" y="302">trace.jsonl</text><text x="676" y="322">steps.jsonl</text>
  </g>
  <rect x="668" y="334" width="274" height="30" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <text x="678" y="354" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#14532d">artifacts/transcript_vN.md</text>
  <text x="668" y="382" font-size="11" fill="#166534">Atomic write: temp → fsync → rename.</text>
  <text x="668" y="399" font-size="11" fill="#166534">A prompt-injected agent cannot rewrite its trace.</text>

  <line x1="620" y1="240" x2="648" y2="240" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Trust boundary -->
  <line x1="20" y1="446" x2="980" y2="446" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="10 6"/>
  <rect x="415" y="434" width="170" height="24" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="451" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">TRUST BOUNDARY</text>

  <!-- Runtime -->
  <rect x="40" y="478" width="580" height="248" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="60" y="502" font-size="13.5" font-weight="700" fill="#7c2d12">RUNTIME</text>
  <text x="132" y="502" font-size="11.5" font-style="italic" fill="#b45309">untrusted · disposable --rm container, one per turn</text>
  <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="60" y="516" width="540" height="32" rx="4" fill="#ffffff" stroke="#fdba74"/>
    <text x="74" y="537" fill="#374151">/workspace</text><text x="300" y="537" fill="#b45309">rw</text><text x="345" y="537" fill="#6b7280">agent files</text>
    <rect x="60" y="554" width="540" height="32" rx="4" fill="#ffffff" stroke="#fdba74"/>
    <text x="74" y="575" fill="#374151">/codex-home</text><text x="300" y="575" fill="#b45309">rw</text><text x="345" y="575" fill="#6b7280">Codex rollouts</text>
    <rect x="60" y="592" width="540" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="74" y="613" fill="#14532d">/workspace/.memory/artifacts</text><text x="300" y="613" font-weight="700" fill="#15803d">ro</text><text x="345" y="613" font-size="11" font-weight="600" fill="#15803d">READ-ONLY — agent reads, cannot write</text>
  </g>
  <text x="60" y="652" font-size="12.5" font-weight="600" fill="#7c2d12">Codex CLI</text>
  <text x="60" y="674" font-size="11.5" fill="#9a3412">--network bridge — required to reach Ark. This sandbox is NOT airgapped.</text>
  <text x="60" y="700" font-size="11.5" fill="#9a3412">Every Codex --json item is streamed back over onEventLine and becomes one StepEvent.</text>

  <!-- Ark -->
  <rect x="650" y="556" width="310" height="90" rx="6" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="668" y="582" font-size="13" font-weight="700" fill="#27272a">Volcengine Ark gateway</text>
  <text x="668" y="604" font-size="11.5" fill="#52525b">OpenAI-compatible /responses</text>
  <text x="668" y="626" font-size="11.5" font-weight="600" fill="#b91c1c">External service — outside the sandbox</text>
  <line x1="620" y1="600" x2="648" y2="600" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="612" y="592" text-anchor="end" font-size="11" fill="#6b7280">HTTPS</text>

  <!-- artifacts bind -->
  <path d="M 806 366 L 806 420 Q 806 430 796 430 L 340 430 Q 330 430 330 440 L 330 592" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="560" y="424" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">bind, read-only — the one deliberate crossing</text>

  <text x="500" y="756" text-anchor="middle" font-size="11.5" fill="#6b7280">Compaction is armed from measured usage and governs context at turn granularity, not token granularity.</text>
  <text x="500" y="776" text-anchor="middle" font-size="11.5" fill="#6b7280">An unknown model disables compaction and emits compaction_disabled rather than guessing a window.</text>
</svg>
